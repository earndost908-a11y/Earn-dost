<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnDost</title>
<style>
 body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding-bottom:70px}
 .page{display:none;padding:15px}
 .page.active{display:block}
 .card{background:linear-gradient(135deg,#00c6ff,#0072ff);padding:20px;border-radius:15px;text-align:center;margin-bottom:15px}
 .card h2{margin:0;font-size:22px}
 .card p{margin:5px 0 0;font-size:14px}
 .box{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px}
 .box input{width:100%;padding:10px;background:#2a2a2a;border:none;color:#fff;border-radius:8px;margin:10px 0;box-sizing:border-box}
 .btn{width:100%;padding:12px;background:#0072ff;border:none;color:#fff;font-weight:bold;border-radius:8px;cursor:pointer;margin-top:8px}
 .btn-google{background:#db4437}
 nav{position:fixed;bottom:0;width:100%;background:#111;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
 nav a{color:#888;text-decoration:none;font-size:11px;text-align:center}
 nav a.active{color:#00c6ff}
 #loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;display:flex;justify-content:center;align-items:center;z-index:999}
</style>
</head>
<body>

<div id="loader">Loading...</div>

<div id="home" class="page"><h2>Welcome <span id="home-name">Loading...</span></h2><div class="card"><h2 id="home-coins">0 Coins</h2></div></div>
<div id="offers" class="page"><h2>Offers</h2><div class="box"><p>App Install - 50 Coins</p><button class="btn">Start</button></div></div>
<div id="store" class="page"><h2>Store</h2><div class="box"><p>Redeem Gift Cards</p><button class="btn">View</button></div></div>
<div id="wallet" class="page"><h2>Wallet</h2><div class="card"><h2 id="wallet-coins">0 Coins</h2></div><button class="btn" onclick="showPage('withdrawal')">Withdraw</button></div>
<div id="withdrawal" class="page"><h2>Withdraw</h2><div class="box"><input type="text" id="upi" placeholder="UPI ID"><input type="number" id="amount" placeholder="Min 500 Coins"><button class="btn" onclick="alert('Request Sent')">Request Withdrawal</button></div></div>
<div id="history" class="page"><h2>History</h2><div class="box"><p>No transactions yet</p></div></div>
<div id="refer" class="page"><h2>Invite & Earn 250 Coins</h2><div class="box"><input type="text" id="referral-link" readonly><button class="btn" onclick="copyLink()">Copy Link</button></div><p>Total Referrals: <span id="refer-count">0</span></p></div>
<div id="profile" class="page"><div class="card"><h2 id="profile-name">Loading...</h2><p id="profile-stats">0 Coins | 0 Referrals</p></div><div class="box"><p>Email: <span id="profile-email"></span></p><button class="btn" onclick="logout()">Logout</button></div></div>
<div id="login" class="page"><h2>Login</h2><div class="box"><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><button class="btn" onclick="login()">Login with Email</button><button class="btn btn-google" onclick="googleLogin()">1 Click - Login with Google</button></div></div>

<nav id="navbar" style="display:none">
  <a href="#" onclick="showPage('home')">Home</a>
  <a href="#" onclick="showPage('offers')">Offers</a>
  <a href="#" onclick="showPage('store')">Store</a>
  <a href="#" onclick="showPage('wallet')">Wallet</a>
  <a href="#" onclick="showPage('history')">History</a>
  <a href="#" onclick="showPage('refer')">Refer</a>
  <a href="#" onclick="showPage('profile')">Profile</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAaPptpt2LjX0nhUoqS8VR0Di9HjvYyMXE",
    authDomain: "earn-dost-d8c85.firebaseapp.com",
    projectId: "earn-dost-d8c85",
    storageBucket: "earn-dost-d8c85.firebasestorage.app",
    messagingSenderId: "1019395758465",
    appId: "1:1019395758465:web:5298eede37878a87e17080"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getFirestore();
  const provider = new GoogleAuthProvider();

  window.showPage = (pageId) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.querySelector(`nav a[onclick="showPage('${pageId}')"]`)?.classList.add('active');
  }

  // YE PURA FUNCTION BADAL DIYA - AB NAME PAKKA AAYEGA
  onAuthStateChanged(auth, async (user) => {
    document.getElementById('loader').style.display = 'none';
    if (user) {
      document.getElementById('navbar').style.display = 'flex';
      const userRef = doc(db, "users", user.uid);
      let userName = user.displayName || user.email.split('@')[0]; // PEHLE HI NAAM BANA LO
      const snap = await getDoc(userRef);

      if(!snap.exists()){
        // NAYA USER - TURANT SAVE KARO
        let newUserData = {
          name: userName, email: user.email, photo: user.photoURL || "",
          coins: 0, pending: 0, referrals: 0, referredBy: null, createdAt: new Date()
        };
        await setDoc(userRef, newUserData);
      } else {
        // PURANA USER - AGAR NAAM KHALI HAI TO UPDATE KARO
        let oldData = snap.data();
        if(!oldData.name){
          await updateDoc(userRef, { name: userName });
        } else {
          userName = oldData.name; // FIRESTORE WALA NAAM USE KARO
        }
      }

      // SCREEN PE TURANT NAAM DAAL DO
      document.getElementById('profile-name').innerText = userName;
      document.getElementById('home-name').innerText = userName;
      document.getElementById('profile-email').innerText = user.email;
      
      let finalData = snap.exists() ? snap.data() : {coins:0, referrals:0};
      document.getElementById('profile-stats').innerText = `${finalData.coins || 0} Coins | ${finalData.referrals || 0} Referrals`;
      document.getElementById('home-coins').innerText = `${finalData.coins || 0} Coins`;
      document.getElementById('wallet-coins').innerText = `${finalData.coins || 0} Coins`;
      document.getElementById('refer-count').innerText = finalData.referrals || 0;
      document.getElementById('referral-link').value = `https://earndost.netlify.app/?ref=${user.uid}`;
      
      showPage('home');

    } else {
      document.getElementById('navbar').style.display = 'none';
      showPage('login');
    }
  });

  window.login = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try{ await signInWithEmailAndPassword(auth, email, password); }
    catch(e){ alert(e.message); }
  }
  
  window.googleLogin = async () => {
    try{ await signInWithPopup(auth, provider); }
    catch(e){ alert(e.message); }
  }

  window.logout = async () => { await signOut(auth); }
  window.copyLink = () => { document.getElementById('referral-link').select(); document.execCommand('copy'); alert("Link Copied!"); }

</script>
</body>
</html>
